services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotes}
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt in with `docker compose --profile observability up -d`; the default `up -d` starts Postgres only.
  aspire-dashboard:
    profiles: ["observability"]
    # 13.5.2, not 13: 13.6.1 counts the traces but draws an empty list.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    environment:
      # No login: fine because both ports are published on loopback only.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888" # dashboard UI
      - "127.0.0.1:4317:18889" # OTLP/gRPC, where the API sends spans and logs

volumes:
  postgres-data:
