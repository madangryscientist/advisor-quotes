name: UI review
on:
  pull_request:
    paths:
      - "apps/web/src/**/*.tsx"
      - "apps/web/src/**/*.css"
permissions:
  contents: read
concurrency:
  group: ui-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-review:
    permissions:
      contents: read
      pull-requests: write
    uses: madangryscientist/hackcove/.github/workflows/ui-review.yml@main
    with:
      paths: |
        apps/web/src/**/*.tsx
        apps/web/src/**/*.css
        !apps/web/src/**/*.test.tsx
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
